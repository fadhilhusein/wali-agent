[project]
name = "wali"
version = "0.1.0"
description = "A safe, conversational finance agent for small businesses (simulation only)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==1.13.0",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-telegram-bot==22.8",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The repo root, so tests can import the eval package.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
